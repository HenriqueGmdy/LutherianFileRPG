<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ficha Lutherian</title>
    <link rel="styleSheet" href="style.css">
</head>
<body>

    <div class="mainFile">
        <h1>Ficha do Personagem</h1>

        <!-- INFORMAÇÕES BÁSICAS -->
        <fieldset>
    <legend>Básico</legend>
    <div class="basicContainer">

        <!-- Coluna da Esquerda: Nome, Nível, Raça, Vantagens, Classe, Subclasse -->
        <div class="basicColumn">
            <div class="groupCamp">
                <label for="name">Nome:</label>
                <input type="text" id="name" placeholder="Nome do personagem">
            </div>

            <div class="groupCamp">
                <label for="level">Nível:</label>
                <input type="number" id="level" min="1" max="9" value="1">
            </div>

<!-- Seção de Raça e suas caixas separadas -->
            <div class="groupCamp">
                <label for="race">Raça:</label>
                <select id="race">
                    <option value="">Selecione a Raça...</option>
                    <option value="human">Humano</option>
                    <option value="basilisk">Basilisco</option>
                    <option value="gray">Cinzento</option>
                    <option value="constructs">Constructo</option>
                    <option value="goblins">Goblin</option>
                    <option value="resonant">Ressonante</option>
                </select>
            </div>

            <!-- Container dividindo Vantagem e Maldição lado a lado -->
         <div class="raceTraitsContainer">
            <div class="raceTraitBox">
                <strong>Vantagem:</strong>
                <p id="raceAdvantageDescription">Nenhuma raça selecionada.</p>
            </div>
            <div class="raceTraitBox">
                <strong>Maldição:</strong>
                <p id="raceCurseDescription">Nenhuma raça selecionada.</p>
            </div>
        </div>

        <div class="groupCamp">
                <label for="chaClass">Classe:</label>
                <input type="text" id="chaClass" placeholder="Ex: Guerreiro">
        </div>

        <div class="groupCamp">
                <label for="chaSubclass">Subclasse:</label>
                <input type="text" id="chaSubclass" placeholder="Ex: Mestre de Armas">
            </div>
        </div>

        <!-- Coluna da Direita: Altura, Peso, Idade e Origem -->
        <div class="basicColumn">
            <div class="groupCamp">
                <label for="height">Altura (m):</label>
                <input type="text" id="height" placeholder="Ex: 1.80">
            </div>

            <div class="groupCamp">
                <label for="weight">Peso (kg):</label>
                <input type="text" id="weight" placeholder="Ex: 80">
            </div>

            <div class="groupCamp">
                <label for="age">Idade:</label>
                <input type="number" id="age" min="1" placeholder="Ex: 25">
            </div>

            <div class="groupCamp">
                <label for="origin">Origem:</label>
                <input type="text" id="origin" placeholder="Ex: --">
            </div>

            <!-- Caixinha de Habilidade da Origem -->
            <div class="classTrait">
                <strong>Habilidade de Origem:</strong>
                <p id="originTraitDescription">Nenhuma origem especificada.</p>
            </div>
        </div>

        </div>

    </div>
</fieldset>

    <fieldset>
            <legend>Atributos</legend>
            <!-- O JavaScript vai injetar os pares de atributos e suas condições aqui dentro -->
            <div id="attributesContainer"></div>
        </fieldset>

    <!-- STATUS E RECURSOS -->
    <fieldset>
        <legend>Status</legend>
        <div class="statusContainer">

            <!-- Coluna Esquerda: Vitalidade, Vontade e Estresse -->
            <div class="statusColumn">
                <div class="statusGroup">
                    <label>Vitalidade:</label>
                    <div class="dualInput">
                        <input type="number" id="vitalityCurrent" value="0">
                        <span>/</span>
                        <input type="number" id="vitalityTotal" value="0">
                    </div>
                </div>

                <div class="statusGroup">
                    <label>Vontade:</label>
                    <div class="dualInput">
                        <input type="number" id="willpowerCurrent" value="0">
                        <span>/</span>
                        <input type="number" id="willpowerTotal" value="0">
                    </div>
                </div>

                <div class="statusGroup stressBoxContainer">
                    <label for="stress">Estresse:</label>
                    <div class="stressContent">
                        <div class="stressWrapper">
                            <div class="stressTrack">
                                <div id="stressFill" class="stressFill"></div>
                                <div class="stressMark"></div>
                            </div>
                            <input type="range" id="stress" min="0" max="200" value="0">
                        </div>
                        <div class="stressValueDisplay">
                            <!-- Transformado em input numérico editável -->
                            <input type="number" id="stressNumberInput" min="0" max="200" value="0">
                            <span class="stressMaxLabel">/ 200</span>
                        </div>
                    </div>
                    <div class="stressMarkIndicator">Quando 100 de estresse, rode d20</div>

                    <!-- Condições de Estresse (Aflito / Virtuoso) -->
                    <div class="stressConditions">
                        <label class="stressCheckboxLabel">
                            <input type="checkbox" id="afflictedCheck"> Aflito
                        </label>
                        <label class="stressCheckboxLabel">
                            <input type="checkbox" id="virtuousCheck"> Virtuoso
                        </label>
                    </div>
                </div>
            </div>

            <!-- Coluna Direita: Defesa, Inspiração, Moral, Deslocamento, Ameaça, Tamanho e Iniciativa -->
            <div class="statusColumn">
                <div class="statusGroup">
                    <label for="defense">Classe de Defesa:</label>
                    <input type="number" id="defense" min="0" value="0">
                </div>

                <div class="statusGroup">
                    <label for="inspiration">Inspiração:</label>
                    <input type="number" id="inspiration" min="0" value="0">
                </div>

                <div class="statusGroup">
                    <label for="morale">Moral:</label>
                    <input type="number" id="morale" value="0">
                </div>

                <div class="statusGroup">
                    <label for="speed">Deslocamento:</label>
                    <div class="speedInput">
                        <input type="number" id="speed" min="0" value="6">
                        <span class="unitText">qds</span>
                    </div>
                </div>

                <div class="statusGroup">
                    <label for="threatLevel">Nível de Ameaça:</label>
                    <select id="threatLevel">
                        <option value="nulo">Nulo</option>
                        <option value="sublime">Sublime</option>
                        <option value="besta">Besta</option>
                        <option value="demonio">Demônio</option>
                        <option value="anciao">Ancião</option>
                        <option value="radiante">Radiante</option>
                    </select>
                </div>

                <div class="statusGroup">
                    <label for="size">Tamanho:</label>
                    <select id="size">
                        <option value="pequeno">Pequeno</option>
                        <option value="medio" selected>Médio</option>
                        <option value="grande">Grande</option>
                    </select>
                </div>

                <div class="statusGroup">
                    <label for="initiative">Iniciativa:</label>
                    <input type="text" id="initiative" value="d20 + 0" readonly class="calculatedField">
                </div>
            </div>

        </div>
    </fieldset>

    </div>

    <script src="script.js"></script>
</body>
</html>
