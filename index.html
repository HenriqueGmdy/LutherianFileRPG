<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ficha Lutherian</title>
    <link rel="styleSheet" href="style.css">
</head>
<body>

    <div class="mainFile">
        <h1>Ficha do Personagem</h1>

        <!-- INFORMAÇÕES BÁSICAS -->
        <fieldset>
    <legend>Básico</legend>
    <div class="basicContainer">

        <!-- Coluna da Esquerda: Nome, Nível, Raça, Vantagens, Classe, Subclasse -->
        <div class="basicColumn">
            <div class="groupCamp">
                <label for="name">Nome:</label>
                <input type="text" id="name" placeholder="Nome do personagem">
            </div>

            <div class="groupCamp">
                <label for="level">Nível:</label>
                <input type="number" id="level" min="1" max="9" value="1">
            </div>

            <div class="groupCamp">
                <label for="race">Raça:</label>
                <select id="race">
                    <option value="">Selecione a Raça...</option>
                    <option value="human">Humano</option>
                    <option value="basilisk">Basilisco</option>
                    <option value="gray">Cinzento</option>
                    <option value="constructs">Constructo</option>
                    <option value="goblins">Goblin</option>
                    <option value="resonant">Ressonante</option>
                </select>
            </div>

            <div class="raceAdvantages">
                <strong>Vantagens da Raça:</strong>
                <p id="raceDescription">Nenhuma raça selecionada.</p>
            </div>

            <div class="groupCamp">
                <label for="chaClass">Classe:</label>
                <input type="text" id="chaClass" placeholder="Ex: Guerreiro">
            </div>

            <div class="groupCamp">
                <label for="chaSubclass">Subclasse:</label>
                <input type="text" id="chaSubclass" placeholder="Ex: Mestre de Armas">
            </div>
        </div>

        <!-- Coluna da Direita: Altura, Peso, Idade e Origem -->
        <div class="basicColumn">
            <div class="groupCamp">
                <label for="height">Altura (m):</label>
                <input type="text" id="height" placeholder="Ex: 1.80">
            </div>

            <div class="groupCamp">
                <label for="weight">Peso (kg):</label>
                <input type="text" id="weight" placeholder="Ex: 80">
            </div>

            <div class="groupCamp">
                <label for="age">Idade:</label>
                <input type="number" id="age" min="1" placeholder="Ex: 25">
            </div>

            <div class="groupCamp">
                <label for="origin">Origem:</label>
                <input type="text" id="origin" placeholder="Ex: --">
            </div>
        </div>

    </div>
</fieldset>

    <fieldset>
            <legend>Atributos</legend>
            <!-- O JavaScript vai injetar os pares de atributos e suas condições aqui dentro -->
            <div id="attributesContainer"></div>
        </fieldset>


    </div>


    <script src="script.js"></script>
</body>
</html>
